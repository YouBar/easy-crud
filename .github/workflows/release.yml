name: release

# Conventional commits on main drive versioning. release-please keeps a rolling
# "chore: release" PR containing the next version bump and the generated
# changelog; merging that PR tags the release and publishes a GitHub Release.
#
# Packagist needs no step here. It listens to this repository through the
# Packagist GitHub App (one-time setup, see CONTRIBUTING), so a new tag is
# picked up automatically. There is no publish credential in CI by design.

on:
  push:
    branches: [main]

# Only contents is needed from GITHUB_TOKEN; the release pull request is
# opened with RELEASE_PLEASE_TOKEN instead (see below).
permissions:
  contents: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # GITHUB_TOKEN cannot open a pull request unless "Allow GitHub Actions
          # to create and approve pull requests" is enabled, which is not always
          # available. A token acts as its owner instead, so the restriction
          # does not apply.
          #
          # Use a fine-grained PAT limited to this repository, with:
          #   Contents: read and write        tag and publish the release
          #   Pull requests: read and write   open and update the release PR
          #
          # Store it as the RELEASE_PLEASE_TOKEN secret. A side benefit over
          # GITHUB_TOKEN: pull requests it opens do trigger other workflows, so
          # tests and quality run on the release PR before you merge it.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
